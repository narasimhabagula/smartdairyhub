    <style>
      /* Hide React root until splash is removed to prevent double-flash */
      #root { opacity: 0; transition: opacity 200ms ease; }
      html.sdh-ready #root { opacity: 1; }

      #sdh-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        gap: 22px;
        transition: opacity 350ms ease;
      }
      #sdh-splash img {
        width: 168px;
        height: 168px;
        object-fit: contain;
        display: block;
      }
      #sdh-splash .sdh-title {
        font-family: 'Poppins', 'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-weight: 700;
        font-size: 34px;
        line-height: 1.2;
        color: #1B5E20;
        letter-spacing: 0.3px;
        text-align: center;
        margin: 0;
      }
      @media (min-width: 768px) {
        #sdh-splash img { width: 190px; height: 190px; }
        #sdh-splash .sdh-title { font-size: 38px; }
      }
      #sdh-splash.sdh-hide { opacity: 0; pointer-events: none; }

    </style>
  </head>

  <body>
    <div id="sdh-splash" role="status" aria-label="Smart Dairy Hub loading">
      <img src="/logo.png" alt="Smart Dairy Hub" />
      <h1 class="sdh-title">Smart Dairy Hub</h1>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var hidden = false;
        function hide() {
          if (hidden) return;
          hidden = true;
          document.documentElement.classList.add('sdh-ready');
          var s = document.getElementById('sdh-splash');
          if (!s) return;
          // small delay so React paints before fade begins (prevents flash)
          requestAnimationFrame(function () {
            s.classList.add('sdh-hide');
            setTimeout(function () { s && s.parentNode && s.parentNode.removeChild(s); }, 400);
          });
        }
        var root = document.getElementById('root');
        if (root) {
          var mo = new MutationObserver(function () {
            if (root.childNodes.length > 0) {
              mo.disconnect();
              // Give React one frame to finish initial paint
              setTimeout(hide, 80);
            }
          });
          mo.observe(root, { childList: true });
        }
        // Safety net
        window.addEventListener('load', function () { setTimeout(hide, 1200); });
        setTimeout(hide, 4000);
      })();
    </script>
  </body>
